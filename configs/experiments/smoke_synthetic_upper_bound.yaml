experiment:
  name: smoke_synthetic_upper_bound
  output_dir: outputs
  docs_dir: docs
  device: cpu
  mixed_precision: false

dataset:
  name: synthetic
  root: null
  classes: [toy]
  k_shots: [1]
  seeds: [0]
  image_size: 64
  synthetic_count: 12

backbone:
  name: identity_patch
  frozen: true
  cache_dir: outputs/feature_cache

model:
  variant: head_pca
  alpha: 0.5
  pca_components: 4
  head_hidden_dim: 32
  synthetic_anomaly_ratio: 1.0

calibration:
  modes: [normal_plus_anomaly_val]
  method: platt
  bins: 10

robustness:
  attacks:
    - name: fgsm
      epsilons: ["1/255"]
  corruptions: [gaussian_noise]

