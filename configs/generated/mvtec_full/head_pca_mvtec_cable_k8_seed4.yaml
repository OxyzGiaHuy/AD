experiment:
  name: head_pca_mvtec_cable_k8_seed4
  output_dir: outputs
  docs_dir: docs
  device: cuda
  mixed_precision: true

dataset:
  name: mvtec
  root: data/mvtec
  classes: [cable]
  k_shots: [8]
  seeds: [4]
  image_size: 518

backbone:
  name: dinov2_vits14
  frozen: true
  cache_dir: outputs/feature_cache
  batch_size: 8

model:
  variant: head_pca
  head_type: mlp
  alpha: 0.0
  pca_components: 64
  head_hidden_dim: 256
  train_steps: 500
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 4096
  synthetic_anomaly_ratio: 1.0

calibration:
  modes: [normal_synthetic]
  method: platt
  bins: 15

robustness:
  attacks:
    - name: fgsm
      epsilons: ["8/255"]
  corruptions: [gaussian_noise, blur, brightness_contrast, jpeg]
